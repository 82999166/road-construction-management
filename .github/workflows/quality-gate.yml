name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型、迁移、测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - name: 安装锁定依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm check
      - name: 迁移卫生检查
        run: pnpm db:check
      - name: 全量回归测试
        run: pnpm test
      - name: 生产构建
        run: pnpm build
      - name: 自建服务器构建
        run: pnpm build:self-host
      - name: 生产依赖安全审计
        run: pnpm audit:prod

  windows-powershell51:
    name: Windows PowerShell 5.1 RFID 脚本解析
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 逐个解析 RFID PowerShell 脚本
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "windows_powershell_51_required"
          }
          $failed = $false
          $scripts = Get-ChildItem -LiteralPath "desktop-bridge" -Filter "*.ps1" -File | Sort-Object Name
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              $failed = $true
              foreach ($parseError in $parseErrors) {
                Write-Error ("{0}:{1}:{2} {3} token={4}" -f $script.Name, $parseError.Extent.StartLineNumber, $parseError.Extent.StartColumnNumber, $parseError.ErrorId, $parseError.Extent.Text)
              }
            } else {
              Write-Output ("parsed_ok=" + $script.Name)
            }
          }
          if ($failed) {
            throw "rfid_powershell_parse_failed"
          }
