name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型、迁移、测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET: ci-only-rfid-signing-secret-not-for-production
      TEMP_ADMIN_USERNAME: ci-only-temporary-admin
      TEMP_ADMIN_PASSWORD: ci-only-Temporary-Admin-Password-2026
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装锁定依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm check
      - name: 迁移卫生检查
        run: pnpm db:check
      - name: 全量回归测试
        run: pnpm test
      - name: 生产构建
        run: pnpm build
      - name: 自建服务器构建
        run: pnpm build:self-host
      - name: 生产依赖安全审计
        run: pnpm audit:prod

  windows-powershell51:
    name: Windows PowerShell 5.1 RFID 脚本解析
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 逐个解析 RFID PowerShell 脚本
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "windows_powershell_51_required"
          }
          $failed = $false
          $scripts = Get-ChildItem -LiteralPath "desktop-bridge" -Filter "*.ps1" -File | Sort-Object Name
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              $failed = $true
              foreach ($parseError in $parseErrors) {
                Write-Error ("{0}:{1}:{2} {3} token={4}" -f $script.Name, $parseError.Extent.StartLineNumber, $parseError.Extent.StartColumnNumber, $parseError.ErrorId, $parseError.Extent.Text)
              }
            } else {
              Write-Output ("parsed_ok=" + $script.Name)
            }
          }
          if ($failed) {
            throw "rfid_powershell_parse_failed"
          }
          $bomRequired = @(
            "desktop-bridge/upgrade_utrust_bridge.ps1",
            "desktop-bridge/utrust_local_bridge.ps1",
            "desktop-bridge/run_utrust_rfid_write.ps1"
          )
          foreach ($path in $bomRequired) {
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $path))
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              throw ("utf8_bom_required=" + $path)
            }
            Write-Output ("utf8_bom_ok=" + $path)
          }
          $env:UTRUST_PACKAGE_OUTPUT_DIR = $env:RUNNER_TEMP
          node scripts/package-utrust-first-install.mjs
          $firstInstallZip = Join-Path $env:RUNNER_TEMP "utrust-bridge-first-install-v13-20261016.zip"
          if (-not (Test-Path -LiteralPath $firstInstallZip)) { throw "first_install_package_not_created" }
          $firstInstallExtract = Join-Path $env:RUNNER_TEMP "utrust-first-install"
          Expand-Archive -LiteralPath $firstInstallZip -DestinationPath $firstInstallExtract -Force
          $firstInstallScripts = @(Get-ChildItem -LiteralPath $firstInstallExtract -Filter "*.ps1" -File | Sort-Object Name)
          if ($firstInstallScripts.Count -lt 8) { throw "first_install_package_incomplete" }
          foreach ($script in $firstInstallScripts) {
            $bytes = [System.IO.File]::ReadAllBytes($script.FullName)
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) { throw ("first_install_utf8_bom_missing=" + $script.Name) }
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors -and $parseErrors.Count -gt 0) { throw ("first_install_script_parse_failed=" + $script.Name) }
            Write-Output ("first_install_distribution_ok=" + $script.Name)
          }
          $doubleClickInstaller = Join-Path $firstInstallExtract "安装写卡桥接.cmd"
          if (-not (Test-Path -LiteralPath $doubleClickInstaller)) { throw "first_install_double_click_launcher_missing" }
          $launcherText = [System.IO.File]::ReadAllText($doubleClickInstaller, [System.Text.Encoding]::Default)
          if ($launcherText -notmatch "install-utrust-bridge\.ps1" -or $launcherText -notmatch "RunAs") { throw "first_install_double_click_launcher_invalid" }
          Write-Output "first_install_double_click_launcher_ok"
          $zipPath = Join-Path $env:RUNNER_TEMP "rfid-powershell-distribution.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "rfid-powershell-distribution"
          Compress-Archive -LiteralPath $bomRequired -DestinationPath $zipPath -Force
          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractPath -Force
          foreach ($path in $bomRequired) {
            $fileName = Split-Path $path -Leaf
            $extractedPath = Join-Path $extractPath $fileName
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($extractedPath, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              throw ("extracted_script_parse_failed=" + $fileName)
            }
            $bytes = [System.IO.File]::ReadAllBytes($extractedPath)
            if ($bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              throw ("extracted_utf8_bom_missing=" + $fileName)
            }
            Write-Output ("distribution_parsed_ok=" + $fileName)
          }
