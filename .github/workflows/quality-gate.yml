name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型、迁移、测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - name: 安装锁定依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm check
      - name: 迁移卫生检查
        run: pnpm db:check
      - name: 全量回归测试
        run: pnpm test
      - name: 生产构建
        run: pnpm build
      - name: 自建服务器构建
        run: pnpm build:self-host
      - name: 生产依赖安全审计
        run: pnpm audit:prod
